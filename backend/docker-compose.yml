version: '3.8'

services:
  voc-agent-backend:
    build: .
    container_name: voc-agent-backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=claude-3-5-sonnet-20241022
      - EMBEDDING_MODEL=intfloat/multilingual-e5-large-instruct
      - EMBEDDING_DIM=1024
      - HYBRID_ALPHA=0.1
      - DEFAULT_TOP_K=20
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
